<title>📖 راهنمای کامل ربات اقتصادی</title>
<style>
  :root{
    --bg:#0a0c11; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e9ecf1; --muted:#8b93a3; --accent:#5b8cff; --accent2:#22c55e;
  }
  *{box-sizing:border-box;}
  html{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(91,140,255,.18), transparent 42%),
      radial-gradient(circle at 88% 15%, rgba(139,92,246,.14), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(34,197,94,.10), transparent 50%),
      linear-gradient(160deg, #0a0c11 0%, #0d1017 45%, #0a0c11 100%);
    background-attachment:fixed;
    height:100%;
    overscroll-behavior-y:none;
  }
  body{
    background-color:var(--bg); color:var(--text); font-family:'Segoe UI',Tahoma,Vazirmatn,sans-serif;
    margin:0; padding:0; direction:rtl; min-height:100%;
    overscroll-behavior-y:none;
  }
  .stars-bg{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
  }
  .p-dot{
    position:absolute; border-radius:50%;
    background:radial-gradient(circle, rgba(255,246,208,1) 0%, rgba(245,209,122,.9) 40%, rgba(245,209,122,0) 75%);
    animation-name:pDrift, pTwinkle;
    animation-timing-function:ease-in-out, ease-in-out;
    animation-iteration-count:infinite, infinite;
    animation-duration:var(--dur), var(--tw);
  }
  .p-star{
    position:absolute; color:#f5d17a; line-height:1;
    text-shadow:0 0 6px rgba(245,209,122,.85), 0 0 12px rgba(245,209,122,.4);
    animation-name:pDrift, pTwinkle;
    animation-timing-function:ease-in-out, ease-in-out;
    animation-iteration-count:infinite, infinite;
    animation-duration:var(--dur), var(--tw);
  }
  @keyframes pDrift{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(var(--dx), var(--dy)); }
  }
  @keyframes pTwinkle{
    0%,100%{ opacity:var(--minop); }
    50%{ opacity:var(--maxop); }
  }
  .wrap{max-width:1100px; margin:0 auto; padding:28px 20px; position:relative; z-index:1;}
  h1{
    font-size:24px; margin:0 0 4px; font-weight:800;
    background:linear-gradient(90deg, #fff, #a8c4ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
  a{color:var(--accent); text-decoration:none;}

  .guide-search{
    position:sticky; top:0; z-index:50; padding:16px 0 14px;
    background:transparent;
    margin-bottom:8px;
  }
  .guide-search-wrap{
    position:relative; border-radius:18px; padding:3px;
    background:linear-gradient(120deg, #f5d17a, #fff6d0, #d4a94a, #fff6d0, #f5d17a);
    background-size:300% 300%;
    animation:goldShift 5s ease-in-out infinite;
    filter:drop-shadow(0 0 18px rgba(245,209,122,.35));
  }
  @keyframes goldShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .guide-search input{
    width:100%; padding:15px 48px 15px 18px; font-size:15.5px; border-radius:15px;
    background:#12141a; border:none; color:var(--text);
    font-family:inherit; position:relative; z-index:1;
  }
  .guide-search input::placeholder{color:#9a9fab;}
  .guide-search input:focus{outline:none;}
  .guide-search-wrap .icon{
    position:absolute; right:18px; top:50%; transform:translateY(-50%);
    color:#f5d17a; font-size:17px; pointer-events:none; z-index:2;
  }
  .cat-title{
    font-size:14px; font-weight:700; color:var(--accent); margin:22px 0 10px;
    display:flex; align-items:center; gap:8px;
  }
  .cmd-card{
    background:linear-gradient(160deg, var(--panel), #14171e);
    border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between;
    align-items:center; gap:14px; transition:.15s; flex-wrap:wrap;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  .cmd-card:hover{
    border-color:rgba(91,140,255,.4); background:linear-gradient(160deg, var(--panel2), #191d26);
    box-shadow:0 10px 28px rgba(91,140,255,.12);
  }
  .cmd-main{flex:1; min-width:200px;}
  .cmd-code{
    font-family:monospace; font-size:14.5px; color:#a8c4ff; background:rgba(91,140,255,.08);
    border:1px solid rgba(91,140,255,.2); border-radius:8px; padding:4px 10px; display:inline-block;
    direction:ltr; text-align:right; margin-bottom:6px;
  }
  .cmd-desc{color:var(--muted); font-size:12.5px; line-height:1.6;}
  .copy-btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; gap:6px; font-weight:600; font-family:inherit;
  }
  .copy-btn:hover{border-color:var(--accent); color:var(--accent);}
  .copy-btn.copied{background:rgba(34,197,94,.15); border-color:rgba(34,197,94,.4); color:#7ee2a8;}
  .admin-only{border-color:rgba(245,158,11,.3);}
  .admin-only .cmd-code{color:#ffcf80; background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.25);}
  .no-results{text-align:center; color:var(--muted); padding:40px 0; display:none;}
  .admin-badge{
    display:inline-block; background:rgba(245,158,11,.15); color:#ffcf80; font-size:10.5px;
    padding:2px 8px; border-radius:99px; margin-right:6px; border:1px solid rgba(245,158,11,.3);
  }
</style>
</head>

function renderCommands() {
  const wrap = document.getElementById('commandsWrap');
  let html = '';
  CATEGORIES.forEach(cat => {
    html += `<div class="cat-title" data-cat>${cat.title}</div>`;
    cat.items.forEach(item => {
      html += `
        <div class="cmd-card ${cat.admin ? 'admin-only' : ''}" data-cmd="${item.cmd.toLowerCase()}" data-desc="${item.desc.toLowerCase()}">
          <div class="cmd-main">
            ${cat.admin ? '<span class="admin-badge">ادمین</span>' : ''}
            <div class="cmd-code">${item.cmd}</div>
            <div class="cmd-desc">${item.desc}</div>
          </div>
          <button class="copy-btn" onclick="copyCmd(this, '${item.cmd.replace(/'/g, "\\\\'")}')">📋 کپی</button>
        </div>`;
    });
  });
  wrap.innerHTML = html;
}

function showCopied(btn) {
  const original = btn.innerHTML;
  btn.innerHTML = '✅ کپی شد';
  btn.classList.add('copied');
  setTimeout(() => { btn.innerHTML = original; btn.classList.remove('copied'); }, 1300);
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

function copyCmd(btn, text) {
  // navigator.clipboard فقط روی HTTPS (یا localhost) کار می‌کنه؛ اگه در
  // دسترس نبود یا رد شد، از روش قدیمی‌تر (textarea + execCommand) استفاده می‌کنیم
  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => showCopied(btn),
      () => { if (fallbackCopy(text)) showCopied(btn); else alert('کپی نشد، خودت متن رو انتخاب و کپی کن: ' + text); }
    );
  } else {
    if (fallbackCopy(text)) showCopied(btn);
    else alert('کپی نشد، خودت متن رو انتخاب و کپی کن: ' + text);
  }
}

renderCommands();

function filterCommands() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const cards = document.querySelectorAll('.cmd-card');
  const titles = document.querySelectorAll('[data-cat]');
  let anyVisible = false;

  cards.forEach(card => {
    const match = !q || card.dataset.cmd.includes(q) || card.dataset.desc.includes(q);
    card.style.display = match ? 'flex' : 'none';
    if (match) anyVisible = true;
  });

  titles.forEach(title => {
    let next = title.nextElementSibling;
    let hasVisible = false;
    while (next && !next.hasAttribute('data-cat')) {
      if (next.style.display !== 'none') hasVisible = true;
      next = next.nextElementSibling;
    }
    title.style.display = hasVisible ? 'flex' : 'none';
  });

  document.getElementById('noResults').style.display = anyVisible ? 'none' : 'block';
}
